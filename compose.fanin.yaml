services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fanin
      POSTGRES_USER: local_demo
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?set ephemeral local password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_demo -d fanin"]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
  mailmock:
    image: wiremock/wiremock:3.9.2
    ports: ["18089:8080"]
    volumes: ["./test-support/brevo-mapping.json:/home/wiremock/mappings/brevo.json:ro"]
  users:
    build: ${USERS_SOURCE:-../users-management-spring-boot-hexagonal-ddd}
    ports: ["18080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fanin
      DB_USERNAME: local_demo
      DB_PASSWORD: ${LOCAL_DATABASE_PASSWORD}
      DB_SSLMODE: disable
      DB_SCHEMA_INIT_MODE: always
      JWT_SECRET: ${LOCAL_JWT_SECRET:?set ephemeral signing key}
      SEED_ADMIN_ENABLED: "true"
      SEED_ADMIN_EMAIL: admin@example.test
      SEED_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?set ephemeral admin password}
      APP_KAFKA_ENABLED: "true"
      APP_DOMAIN_EVENTS_ENABLED: "true"
      APP_KAFKA_IN_PROCESS_WORKER_ENABLED: "false"
      APP_EMAIL_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_USERNAME: local
      KAFKA_PASSWORD: local
  accounts:
    build: ${ACCOUNTS_SOURCE:-../users-accounts-service}
    ports: ["18081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: local
      ACCOUNTS_DATABASE_URL: jdbc:postgresql://postgres:5432/fanin
      ACCOUNTS_DATABASE_USERNAME: local_demo
      ACCOUNTS_DATABASE_PASSWORD: ${LOCAL_DATABASE_PASSWORD}
      DB_SCHEMA_INIT_MODE: always
      USERS_API_URL: http://users:8080
      JWT_SECRET: ${LOCAL_JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_USERNAME: local
      KAFKA_PASSWORD: local
  notifications:
    build: .
    ports: ["18082:8082"]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: local
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_USERNAME: local
      KAFKA_PASSWORD: local
      BREVO_API_KEY: fake-local-only
      BREVO_FROM_ADDRESS: no-reply@example.test
      BREVO_BASE_URL: http://mailmock:8080
